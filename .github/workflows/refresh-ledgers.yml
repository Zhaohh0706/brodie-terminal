name: refresh ledgers

# Keeps the baked snapshots fresh so the page's catch-up stays short.
# The page streams Transfer events over a websocket on top of these.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Replay chain ledgers
        working-directory: tools
        run: |
          set -eu
          python3 onchain_audit.py
          python3 dump_holders.py
          python3 dump_all.py
          python3 flows.py
          python3 timeline.py
          python3 sell_attrib.py

      - name: Re-inject into index.html
        run: python3 scripts/inject.py

      # A silent no-op here is how this job failed unnoticed for two days:
      # the page kept serving a stale ledger while every run went red.
      - name: Verify the page actually moved
        run: |
          set -eu
          python3 - <<'EOF'
          import json, re, sys, pathlib
          html = pathlib.Path("index.html").read_text()
          hold = re.search(r'window\.HOLD=\{"block":(\d+)', html)
          ledger = json.loads(pathlib.Path("tools/holders_all.json").read_text())
          assert hold, "window.HOLD literal not found in index.html"
          if int(hold.group(1)) != ledger["block"]:
              sys.exit("injection did not take: page says block %s, ledger says %s"
                       % (hold.group(1), ledger["block"]))
          # window.SA silently went unrefreshed from launch until 15 Sep. Verify it too.
          sa_page = re.search(r'window\.SA=\{[^}]*?"block":(\d+)', html)
          sa_file = json.loads(pathlib.Path("tools/sell_attrib.json").read_text())
          assert sa_page, "window.SA literal not found in index.html"
          if int(sa_page.group(1)) != sa_file["block"]:
              sys.exit("sell-attrib injection did not take: page %s, ledger %s"
                       % (sa_page.group(1), sa_file["block"]))
          print("injected through block %s (sell-attrib %s)" % (ledger["block"], sa_file["block"]))
          EOF

      # A push can lose a race with a human commit landing during the 12-minute
      # replay. Rebasing a 300KB single-line literal is not worth attempting, so
      # on rejection we take the newest page, re-apply the fresh ledgers to it,
      # and try again.
      - name: Commit and push
        id: commit
        run: |
          set -eu
          git config user.name  "brodie-terminal-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- index.html tools; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ledgers unchanged"
            exit 0
          fi
          MSG="chore: refresh ledgers $(date -u +%FT%TZ)"
          mkdir -p /tmp/ledgers
          for attempt in 1 2 3; do
            git add index.html tools
            git diff --staged --quiet || git commit -q -m "$MSG"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebuilding on top of origin/main"
            cp tools/*.json /tmp/ledgers/
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/ledgers/*.json tools/
            python3 scripts/inject.py
          done
          echo "could not push after 3 attempts" >&2
          exit 1

      - name: Redeploy to Vercel
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
