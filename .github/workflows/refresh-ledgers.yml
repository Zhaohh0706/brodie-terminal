name: refresh ledgers

# Keeps the baked snapshots fresh so the page's catch-up stays short.
# The page streams Transfer events over a websocket on top of these.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Replay chain ledgers
        working-directory: tools
        run: |
          set -eu
          python3 onchain_audit.py
          python3 dump_holders.py
          python3 dump_all.py
          python3 timeline.py
          python3 burns.py

      - name: Write data/*.json for the page
        run: python3 scripts/inject.py

      # A silent no-op here is how this job failed unnoticed for two days:
      # the page kept serving a stale ledger while every run went red.
      - name: Verify the page actually moved
        run: |
          set -eu
          python3 - <<'EOF'
          import json, pathlib, sys
          page = json.loads(pathlib.Path("data/hold.json").read_text())
          ledger = json.loads(pathlib.Path("tools/holders_all.json").read_text())
          if page["block"] != ledger["block"]:
              sys.exit("data/hold.json did not move: %s vs ledger %s" % (page["block"], ledger["block"]))
          print("data written through block %s" % ledger["block"])
          EOF

      # Block numbers matching is not the same as the page still working. On
      # 15 September every number check passed while boot() was dead.
      - name: Smoke-test the page against its own data
        run: python3 scripts/smoke.py

      # A push can lose a race with a human commit landing during the 12-minute
      # replay. On rejection we take the newest main, re-apply the fresh ledgers
      # to it, and try again.
      - name: Commit and push
        id: commit
        run: |
          set -eu
          git config user.name  "brodie-terminal-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- data tools; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ledgers unchanged"
            exit 0
          fi
          MSG="chore: refresh ledgers $(date -u +%FT%TZ)"
          mkdir -p /tmp/ledgers
          for attempt in 1 2 3; do
            git add data tools
            git diff --staged --quiet || git commit -q -m "$MSG"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebuilding on top of origin/main"
            cp tools/*.json /tmp/ledgers/
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/ledgers/*.json tools/
            python3 scripts/inject.py
          done
          echo "could not push after 3 attempts" >&2
          exit 1

      - name: Redeploy to Vercel
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
